name: Build and Deploy KoreanBible Reader

"on":
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v6

      - name: Checkout KRV 1961 source
        uses: actions/checkout@v6
        with:
          repository: bluesaurel/Korean-Bible-1961-KRV
          path: _krv_source
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build complete embedded Bible
        run: python3 tools/build_embedded.py --template index.html --source _krv_source/bible_1961_krv.json --output dist/index.html

      - name: Verify generated Pages files
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/build-info.json || true

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          index = Path("dist/index.html")
          if not index.exists():
              raise SystemExit("dist/index.html was not generated")

          text = index.read_text(encoding="utf-8")

          match = re.search(
              r'<script id="embeddedBible" type="application/json">(.*?)</script>',
              text,
              re.S,
          )
          if not match:
              raise SystemExit("embeddedBible was not found in dist/index.html")

          books = json.loads(match.group(1))

          book_count = len(books)
          chapter_count = sum(len(book.get("chapters", [])) for book in books)
          verse_count = sum(
              1
              for book in books
              for chapter in book.get("chapters", [])
              for verse in chapter.get("verses", [])
              if str(verse.get("text", "")).strip()
              and str(verse.get("text", "")).strip() != "(없음)"
          )

          expected = (66, 1189, 31102)
          actual = (book_count, chapter_count, verse_count)

          print("Bible validation:", actual)

          if actual != expected:
              raise SystemExit(
                  f"Bible validation failed: expected {expected}, got {actual}"
              )

          if len(index.read_bytes()) < 1_000_000:
              raise SystemExit(
                  "dist/index.html is too small; complete Bible was probably not embedded"
              )

          print("Complete embedded Pages file verified.")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
