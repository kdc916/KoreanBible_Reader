name: Build and Deploy KoreanBible Reader

"on":
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v7

      - name: Show repository files
        shell: bash
        run: |
          set -euxo pipefail
          pwd
          find . -maxdepth 3 -type f | sort | head -200
          test -f index.html
          test -f tools/build_embedded.py

      - name: Download KRV 1961 source repository
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf _krv_source
          git clone --depth 1 https://github.com/bluesaurel/Korean-Bible-1961-KRV.git _krv_source
          test -f _krv_source/bible_1961_krv.json
          test -d _krv_source/data
          echo "KRV source root:"
          ls -lah _krv_source
          echo "Book JSON count:"
          find _krv_source/data -maxdepth 1 -type f -name '*.json' | wc -l

      - name: Build complete embedded Bible
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/build_embedded.py \
            --template index.html \
            --source-dir _krv_source/data \
            --source-json _krv_source/bible_1961_krv.json \
            --output dist/index.html

      - name: Verify generated Pages artifact
        shell: bash
        run: |
          set -euxo pipefail
          test -f dist/index.html
          test -f dist/build-info.json
          cat dist/build-info.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          info=json.loads(Path("dist/build-info.json").read_text(encoding="utf-8"))
          expected={"books":66,"chapters":1189,"verses":31102}
          actual={k:info[k] for k in expected}
          assert actual==expected,(actual,expected)
          assert info["buildMode"]=="complete-embedded"
          size=Path("dist/index.html").stat().st_size
          assert size>1_000_000,size
          print("Artifact OK:",actual,"size=",size)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
